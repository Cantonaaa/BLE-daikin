name: Build BLE-Daikin N16R8

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
          key: ${{ runner.os }}-idf-v5.4

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3

      - name: Build
        run: |
          cd ESP
          idf.py build

      - name: Merge
        run: |
          cd ESP/build
          esptool.py --chip esp32s3 merge_bin --output BLE-Daikin-N16R8.bin \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 BLE-Daikin.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Daikin-N16R8
          path: ESP/build/BLE-Daikin-N16R8.bin
