name: Build BLE-Daikin

on:
  push:
    branches: [ "main", "voice-control" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        working-directory: ESP
        run: |
          . /opt/esp/idf/export.sh
          if [ -f components/voice-control/CMakeLists.txt ]; then
            git clone --depth 1 https://github.com/espressif/esp-sr.git components/esp-sr
            git clone --depth 1 https://github.com/espressif/esp-dsp.git components/espressif__esp-dsp
            python -m idf_component_manager registry sync \
              --component espressif/dl_fft==0.6.0 \
              --interval 0 --resolution latest \
              .registry_cache
            python -m idf_component_manager registry sync \
              --component espressif/cjson==1.7.19 \
              --interval 0 --resolution latest \
              .registry_cache
            unzip -q .registry_cache/components/espressif/dl_fft/0.6.0/espressif__dl_fft-*.zip \
              -d components/espressif__dl_fft
            unzip -q .registry_cache/components/espressif/cjson/1.7.19/espressif__cjson-*.zip \
              -d components/espressif__cjson
            rm -rf .registry_cache
          fi
          idf.py build

      - name: Merge binary
        if: hashFiles('ESP/components/voice-control/CMakeLists.txt') != ''
        shell: bash
        working-directory: ESP
        run: |
          . /opt/esp/idf/export.sh
          esptool.py --chip esp32s3 merge_bin \
            --output BLE-Daikin-VoiceControl-all.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/BLE-Daikin.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ESP/build/BLE-Daikin.bin
            ESP/BLE-Daikin-VoiceControl-all.bin
